[project]
name = "code-embedding-study"
version = "1.0.0"
description = "Replication package for an empirical study of what code embedding models encode"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=16",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "tqdm",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
# Needed only to re-embed (RQ1 to RQ5) or to re-run generation (RQ5).
embed = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "einops",
    "tiktoken",
    "datasets",
]

[dependency-groups]
dev = []
