    public class Solution {
        public int Reverse(int x) {
            int org = x;
            x = Math.Abs(x);
            char[] arr = x.ToString().ToCharArray();
            Array.Reverse(arr);

            long res = long.Parse(new string(arr));
            if (org < 0) {
                res *= -1;
            }

            if (res < int.MinValue || res > int.MaxValue) {
                return 0;
            }
            return (int)res;
        }
    }
- language: go
  time_complexity: O(1)
  space_complexity: O(1)
  code: |-
    func reverse(x int) int {
        org := x
        x = abs(x)
        res := 0

        for x > 0 {
            res = res*10 + x%10
            x /= 10
        }

        if org < 0 {
            res = -res
        }
        if res < -(1 << 31) || res > (1<<31)-1 {
            return 0
        }
        return res
    }

    func abs(x int) int {
        if x < 0 {
            return -x
        }
        return x
    }
- language: kotlin
  time_complexity: O(1)
  space_complexity: O(1)
  code: |-
    class Solution {
        fun reverse(x: Int): Int {
            val org = x
            var num = Math.abs(x)
            var res = 0

            while (num > 0) {
                if (res > (Int.MAX_VALUE - num % 10) / 10) {
                    return 0
                }
                res = res * 10 + num % 10
                num /= 10
            }

            if (org < 0) {
                res = -res
            }
            return if (res < Int.MIN_VALUE || res > Int.MAX_VALUE) 0 else res
        }
    }
