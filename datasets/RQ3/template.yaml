    impl Solution {
        pub fn reverse(x: i32) -> i32 {
            let org = x;
            let x = (x as i64).abs();
            let reversed: String = x.to_string().chars().rev().collect();
            let mut res: i64 = reversed.parse().unwrap();
            if org < 0 {
                res *= -1;
            }
            if res < i32::MIN as i64 || res > i32::MAX as i64 {
                return 0;
            }
            res as i32
        }
    }
- language: python
  time_complexity: O(1)
  space_complexity: O(1)
  code: |-
    class Solution:
        def reverse(self, x: int) -> int:
            def rec(n: int, rev: int) -> int:
                if n == 0:
                    return rev

                rev = rev * 10 + n % 10
                return rec(n // 10, rev)

            sign = -1 if x < 0 else 1
            x = abs(x)
            reversed_num = rec(x, 0)
            reversed_num *= sign
            if reversed_num < -(1 << 31) or reversed_num > (1 << 31) - 1:
                return 0

            return reversed_num
- language: java
